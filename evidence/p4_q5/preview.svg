<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320">
  <rect width="760" height="320" fill="#f7f7f7"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; fill: #222; }
    .title { font-size: 18px; font-weight: 700; }
