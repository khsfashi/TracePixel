    <rect x="60" y="60" width="30" height="30" fill="rgb(20,40,200)" class="cell"/>
    <rect x="30" y="60" width="30" height="30" fill="rgb(30,200,60)" fill-opacity="0.5" class="cell"/>
    <path d="M123 123L147 147M147 123L123 147" stroke="#555" stroke-width="3"/>
  </g>
  <text x="390" y="225" class="label">red: edge + isolated</text>
  <text x="390" y="245" class="label">green: alpha 128 + outside palette</text>
  <text x="390" y="265" class="label">× at (4,4): hidden RGB (9,9,9), alpha 0</text>
  <text x="390" y="285" class="label">required symmetry / tile contract also fail exactly</text>

  <text x="30" y="305" class="label">Explanatory SVG only; authoritative facts come from Q0–Q4 and structural.json.</text>
