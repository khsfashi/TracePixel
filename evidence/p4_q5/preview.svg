    .cell { stroke: #999; stroke-width: 1; }
  </style>

  <text x="30" y="30" class="title">clean — 0 findings</text>
  <g transform="translate(30 50)" shape-rendering="crispEdges">
    <rect width="150" height="150" fill="#e4e4e4" stroke="#333"/>
