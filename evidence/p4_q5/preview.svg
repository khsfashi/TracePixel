  <text x="30" y="225" class="label">centered • opaque • 1 component • symmetric • clear edges</text>

  <text x="390" y="30" class="title">seeded_defects — 9 findings</text>
  <g transform="translate(390 50)" shape-rendering="crispEdges">
    <rect width="150" height="150" fill="#e4e4e4" stroke="#333"/>
    <path d="M30 0V150M60 0V150M90 0V150M120 0V150M0 30H150M0 60H150M0 90H150M0 120H150" stroke="#999"/>
