name: Owner Codex Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - owner/codex-smoke-trigger

permissions:
  contents: read

concurrency:
  group: tracepixel-owner-codex-smoke
  cancel-in-progress: false

env:
  TRACEPIXEL_CODEX_CLI_VERSION: '0.147.0'

jobs:
  p5-a5-real-provider:
    if: >-
      github.repository == 'khsfashi/TracePixel' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/owner/codex-smoke-trigger'))
    runs-on: [self-hosted, windows, x64, tracepixel-owner]
    timeout-minutes: 20

    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare pinned Codex CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $codexRoot = Join-Path $env:RUNNER_TEMP "tracepixel-codex-$env:TRACEPIXEL_CODEX_CLI_VERSION"
          $binDir = Join-Path $codexRoot 'node_modules\.bin'
          $codexCmd = Join-Path $binDir 'codex.cmd'

          if (-not (Test-Path $codexCmd -PathType Leaf)) {
            New-Item -ItemType Directory -Force -Path $codexRoot | Out-Null
            npm install `
              --prefix $codexRoot `
              --no-save `
              --package-lock=false `
              "@openai/codex@$env:TRACEPIXEL_CODEX_CLI_VERSION"
            if ($LASTEXITCODE -ne 0) {
              throw "Pinned Codex CLI install failed with exit code $LASTEXITCODE."
            }
          }

          $actualVersion = (& $codexCmd --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "Pinned Codex CLI version probe failed with exit code $LASTEXITCODE."
          }
          if ($actualVersion -notmatch "(^|\s)$([regex]::Escape($env:TRACEPIXEL_CODEX_CLI_VERSION))($|\s)") {
            throw "Expected Codex CLI $env:TRACEPIXEL_CODEX_CLI_VERSION, got '$actualVersion'."
          }

          $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Prepared $actualVersion at $codexCmd"

      - name: Install TracePixel
        shell: pwsh
        run: python -m pip install -e .

      - name: Verify Codex owner environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          codex --version
          if ($LASTEXITCODE -ne 0) { throw "codex --version failed with exit code $LASTEXITCODE" }
          codex login status
          if ($LASTEXITCODE -ne 0) { throw "codex login status failed with exit code $LASTEXITCODE" }

      - name: Prepare evidence directory
        shell: pwsh
        run: |
          Remove-Item -LiteralPath artifacts/p5-a5-reference-run -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      - name: Run P5-A5 real-provider smoke
        shell: pwsh
        run: python -m evidence.p5_a5.smoke --output-dir artifacts/p5-a5-reference-run

      - name: Upload P5-A5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5-a5-codex-smoke-${{ github.run_id }}
          path: artifacts/p5-a5-reference-run
          if-no-files-found: warn
          retention-days: 30
