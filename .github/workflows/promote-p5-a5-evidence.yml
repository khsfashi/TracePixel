name: Promote P5-A5 Evidence

on:
  push:
    branches:
      - owner/p5-a5-evidence-import

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: github.repository == 'khsfashi/TracePixel'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout evidence branch
        uses: actions/checkout@v4
        with:
          ref: evidence/p5-a5-reference
          fetch-depth: 0

      - name: Download successful owner smoke artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf evidence/p5_a5/reference-run
          mkdir -p evidence/p5_a5/reference-run
          gh run download 31920954315 \
            --repo "$GITHUB_REPOSITORY" \
            --name p5-a5-codex-smoke-31920954315 \
            --dir evidence/p5_a5/reference-run

      - name: Validate promoted evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('evidence/p5_a5/reference-run')
          expected = {
              'manifest.json',
              'telemetry.json',
              'provider-calls.json',
              'final.rgba',
              'final.png',
              'preview-8x.png',
          }
          actual = {path.name for path in root.iterdir() if path.is_file()}
          assert actual == expected, (actual, expected)

          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          telemetry = json.loads((root / 'telemetry.json').read_text(encoding='utf-8'))
          calls = json.loads((root / 'provider-calls.json').read_text(encoding='utf-8'))

          assert manifest['source_commit'] == 'c53d934cb6296c27e29455734c747363d9c8254b'
          assert manifest['loop_status'] == 'finished'
          assert manifest['remaining_findings'] == []
          assert manifest['owner_gate_g3']['model'] == 'gpt-5.6-sol'
          assert manifest['owner_gate_g3']['reasoning_effort'] == 'low'
          assert manifest['owner_gate_g3']['vision_input'] is False
          assert manifest['owner_gate_g3']['codex_cli_version'] == 'codex-cli 0.147.0'
          assert telemetry['tool_calls'] == 1
          assert telemetry['iterations'] == 1
          assert telemetry['operation_calls'] == 1
          assert telemetry['changed_pixels'] == 96
          assert telemetry['visual_observation_calls'] == 0
          assert telemetry['human_interventions'] == 0
          assert telemetry['failure_category'] is None
          assert len(calls) == 1
          assert (root / 'final.rgba').stat().st_size == 16 * 16 * 4

          def digest(name: str) -> str:
              return hashlib.sha256((root / name).read_bytes()).hexdigest()

          assert digest('final.rgba') == manifest['authoritative_rgba_sha256']
          assert digest('final.png') == manifest['native_png']['png_sha256']
          assert digest('preview-8x.png') == manifest['preview_png']['png_sha256']
          PY

      - name: Commit exact artifact bytes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/p5_a5/reference-run
          git diff --cached --quiet && { echo 'No evidence changes to commit.'; exit 1; }
          git commit -m 'Record P5-A5 Codex CLI smoke evidence'
          git push origin HEAD:evidence/p5-a5-reference
