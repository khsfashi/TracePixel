name: G8-H4 cancel duplicate queued run

on:
  push:
    branches: [main]
    paths:
      - .github/g8-h4-cancel-duplicate.trigger

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel duplicate queued H4 run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DUPLICATE_RUN_ID: "32111680356"
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$DUPLICATE_RUN_ID/cancel"
