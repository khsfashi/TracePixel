name: G8-H4 candidate cumulative repack

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/g8-h4-repack.trigger

permissions:
  actions: read
  contents: read

jobs:
  repack:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'agent/g8-h4-repack-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Resolve candidate metadata
        id: meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open('.github/g8-h4-repack.trigger', encoding='utf-8') as handle:
              value = json.load(handle)
          prior = value['expected_prior_run_ids']
          if len(prior) != 1:
              raise SystemExit('current repack workflow requires exactly one retained prior attempt')
          print(f"candidate={value['candidate_run_id']}")
          print(f"prior={prior[0]}")
          PY

      - name: Download succeeded candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: g8-h4-retained-authoring-${{ steps.meta.outputs.candidate }}
          path: artifacts/g8-h4-owner-review
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.meta.outputs.candidate }}

      - name: Download prior retained attempt artifact
        uses: actions/download-artifact@v4
        with:
          name: g8-h4-retained-authoring-${{ steps.meta.outputs.prior }}
          path: artifacts/g8-h4-repack-prior/${{ steps.meta.outputs.prior }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.meta.outputs.prior }}

      - name: Repack downloaded attempts with cumulative raw usage
        shell: bash
        run: |
          python -m evidence.g8_h4.repack_local \
            --current artifacts/g8-h4-owner-review \
            --prior-root artifacts/g8-h4-repack-prior \
            --trigger .github/g8-h4-repack.trigger

      - name: Upload owner H5 review package
        uses: actions/upload-artifact@v4
        with:
          name: g8-h4-owner-review-candidate-${{ steps.meta.outputs.candidate }}
          path: artifacts/g8-h4-owner-review
          if-no-files-found: error
          retention-days: 30
