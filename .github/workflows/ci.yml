name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src tests evidence
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Doctor
        run: tracepixel doctor
      - name: P1-R4 engineering microbenchmark
        run: python -m evidence.p1_r4.benchmark --iterations 7
      - name: P2-IR4 engineering microbenchmark
        run: python -m evidence.p2_ir4.benchmark
      - name: P4-Q5 seeded deterministic QA checkpoint
        run: python -m evidence.p4_q5.checkpoint
      - name: P5-A4 recorded-provider orchestration checkpoint
        run: python -m evidence.p5_a4.checkpoint
      - name: P6-V0 deterministic preview bundle checkpoint
        run: python -m evidence.p6_v0.checkpoint
      - name: P6-V1 deterministic stage contact sheet checkpoint
        run: python -m evidence.p6_v1.checkpoint
      - name: P6-V2 deterministic QA/metrics composition checkpoint
        run: python -m evidence.p6_v2.checkpoint
      - name: P6-V3 deterministic static HTML gallery checkpoint
        run: python -m evidence.p6_v3.checkpoint
      - name: P6-V4 trusted GitHub artifact publishing checkpoint
        run: python -m evidence.p6_v4.checkpoint
      - name: P6-V5 mobile review surface checkpoint
        run: python -m evidence.p6_v5.checkpoint
      - name: B0-H0 matched harness checkpoint
        run: python -m evidence.b0_h0.checkpoint
      - name: B0-B0 frozen baseline adapters checkpoint
        run: python -m evidence.b0_b0.checkpoint
      - name: B0-S0 provider-free scored cohort checkpoint
        run: python -m evidence.b0_s0.checkpoint
      - name: B0-S0 retained evidence and blind review package checkpoint
        run: python -m evidence.b0_s0.review --validate-package-only
      - name: B0-S0 offline mobile owner review package checkpoint
        run: python -m evidence.b0_s0.mobile_review --output out/b0-mobile-review --source-sha 1111111111111111111111111111111111111111
      - name: B0-P0 immutable postmortem checkpoint
        run: python -m evidence.b0_p0.checkpoint
      - name: P7-F0 feedback intake checkpoint
        run: python -m evidence.p7_f0.checkpoint
      - name: P7-F1 feedback localization checkpoint
        run: python -m evidence.p7_f1.checkpoint
      - name: P7-F2 minimal repair plan checkpoint
        run: python -m evidence.p7_f2.checkpoint
      - name: P7-F3 repair execution and deterministic re-QA checkpoint
        run: python -m evidence.p7_f3.checkpoint
      - name: P7-F4 before/after repair evidence checkpoint
        run: python -m evidence.p7_f4.checkpoint
      - name: P7-F5 human feedback contract checkpoint
        run: python -m evidence.p7_f5.checkpoint
      - name: B1-S0 frozen held-out schedule checkpoint
        run: python -m evidence.b1_s0.checkpoint
      - name: B1-P0 immutable generalization postmortem checkpoint
        run: python -m evidence.b1_p0.checkpoint
      - name: P8-X0 bounded AssetSet contract checkpoint
        run: python -m evidence.p8_x0.checkpoint
      - name: P8-R0 research-to-asset profile checkpoint
        run: python -m evidence.p8_r0.checkpoint
      - name: P8-B0 multi-asset request and schedule checkpoint
        run: python -m evidence.p8_b0.checkpoint
      - name: P8-B1 isolated execution and cost telemetry checkpoint
        run: python -m evidence.p8_b1.checkpoint
