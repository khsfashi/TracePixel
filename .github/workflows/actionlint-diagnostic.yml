name: Actionlint diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.12 /tmp/actionlint-bin
      - name: Lint workflows
        shell: bash
        run: |
          set -euo pipefail
          /tmp/actionlint-bin/actionlint -format '{{json .}}' .github/workflows/*.yml
