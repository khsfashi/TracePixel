name: Owner G8-H4 retained static humanoid authoring

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: g8-h4-owner-retained-authoring
  cancel-in-progress: false

jobs:
  retained-authoring:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       github.actor == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 119 &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.body == '/tracepixel g8-h4-author')
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Prepare exact dispatched checkout without marketplace action
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force
          git -C $env:GITHUB_WORKSPACE init
          git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/${{ github.repository }}.git"
          git -C $env:GITHUB_WORKSPACE fetch --depth=1 origin $env:GITHUB_SHA
          git -C $env:GITHUB_WORKSPACE checkout --detach FETCH_HEAD
          $actual = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Manual checkout drifted from dispatched SHA: expected $env:GITHUB_SHA, got $actual"
          }

      - name: Resolve local Python 3.12 and install TracePixel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedExe = $null
          $selectedPrefix = ""

          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -3.12 -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
            if ($LASTEXITCODE -eq 0) {
              $selectedExe = $py.Source
              $selectedPrefix = "-3.12"
            }
          }

          if (-not $selectedExe) {
            $python = Get-Command python -ErrorAction SilentlyContinue
            if ($python) {
              & $python.Source -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) {
                $selectedExe = $python.Source
              }
            }
          }

          if (-not $selectedExe -and $env:RUNNER_TOOL_CACHE) {
            $cached = Get-ChildItem -LiteralPath $env:RUNNER_TOOL_CACHE -Filter python.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Python[\\/]3\.12\.' }
            foreach ($candidate in $cached) {
              & $candidate.FullName -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) {
                $selectedExe = $candidate.FullName
                break
              }
            }
          }

          if (-not $selectedExe) {
            throw "Python 3.12 is required on the trusted owner runner; actions/setup-python is intentionally avoided."
          }

          "TRACEPIXEL_PYTHON=$selectedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACEPIXEL_PYTHON_PREFIX=$selectedPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $prefix = @()
          if ($selectedPrefix) { $prefix += $selectedPrefix }
          & $selectedExe @prefix -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "TracePixel editable install failed." }

      - name: Verify trusted Codex CLI boundary
        shell: pwsh
        run: |
          codex --version
          $status = codex login status 2>&1 | Out-String
          $status
          if ($status -notmatch "Logged in using ChatGPT") {
            throw "G8-H4 requires Codex CLI authenticated through the existing ChatGPT plan boundary."
          }
          if ($status -match "Logged in using an API key") {
            throw "API-key billed Codex execution is not authorized for this owner gate."
          }

      - name: Run retained static humanoid authoring
        id: authoring
        continue-on-error: true
        shell: pwsh
        run: |
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @prefix -m evidence.g8_h4.retained_authoring --output artifacts/g8-h4-retained --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "G8-H4 retained authoring failed after preserving available evidence." }

      - name: Preserve current single-attempt raw complexity
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts/g8-h4-retained | Out-Null
          $attempt = "artifacts/g8-h4-retained/attempt-complexity.json"
          $legacy = "artifacts/g8-h4-retained/complexity.json"
          if ((Test-Path $legacy) -and -not (Test-Path $attempt)) {
            Copy-Item $legacy $attempt
          }
          if (-not (Test-Path $attempt)) {
            $unknown = @{
              measurement_scope = "single-retained-authoring-attempt"
              raw_usage_authoritative = $true
              price_conversion_authoritative = $false
              provider_calls = $null
              input_tokens = $null
              output_tokens = $null
              iterations = $null
              revisions = $null
              operation_calls = $null
              pixel_edits = $null
              changed_pixels = $null
              repair_vs_regeneration = @{
                repair_provider_calls = $null
                regeneration_provider_calls = $null
                canvas_restarts = $null
              }
              wall_time_ns = $null
              cache_or_profile_reuse = @{
                humanoid_profile_reused = $null
                pose_profile_reused = $null
                profile_research_provider_calls = $null
              }
              evidence_completeness = "incomplete-failure-before-exact-attempt-complexity"
            }
            $unknown | ConvertTo-Json -Depth 8 | Set-Content $attempt -Encoding utf8
          }

      - name: Collect prior retained H4 attempt evidence
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          $script = @'
          import io
          import json
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          repo = os.environ["REPOSITORY"]
          owner = os.environ["OWNER"]
          token = os.environ["GH_TOKEN"]
          current_run_id = int(os.environ["GITHUB_RUN_ID"])
          destination = Path("artifacts/g8-h4-prior-attempts")
          destination.mkdir(parents=True, exist_ok=True)
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "TracePixel-G8-H4-cumulative-complexity",
          }

          def request_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          runs = request_json(
              f"https://api.github.com/repos/{repo}/actions/workflows/owner-g8-h4-retained-authoring.yml/runs?branch=main&status=completed&per_page=100"
          ).get("workflow_runs", [])
          for run in runs:
              run_id = int(run.get("id", 0))
              actor = (run.get("actor") or {}).get("login")
              if run_id <= 0 or run_id >= current_run_id or actor != owner:
                  continue
              if run.get("head_branch") != "main" or run.get("event") not in ("issue_comment", "workflow_dispatch"):
                  continue
              artifacts = request_json(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100"
              ).get("artifacts", [])
              retained = next(
                  (
                      artifact for artifact in artifacts
                      if not artifact.get("expired", False)
                      and artifact.get("name") == f"g8-h4-retained-authoring-{run_id}"
                  ),
                  None,
              )
              if retained is None:
                  continue
              archive_request = urllib.request.Request(retained["archive_download_url"], headers=headers)
              with urllib.request.urlopen(archive_request, timeout=60) as response:
                  archive_bytes = response.read()
              target = destination / str(run_id)
              target.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(archive_bytes)) as archive:
                  names = set(archive.namelist())
                  for name in ("attempt-complexity.json", "complexity.json", "summary.json", "failure.json"):
                      if name in names:
                          (target / name).write_bytes(archive.read(name))
          '@
          & $env:TRACEPIXEL_PYTHON @prefix -c $script
          if ($LASTEXITCODE -ne 0) { throw "Failed to collect prior retained H4 attempt evidence." }

      - name: Aggregate raw complexity through current owner candidate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @prefix -m evidence.g8_h4.cumulative_complexity `
            --current artifacts/g8-h4-retained `
            --prior-root artifacts/g8-h4-prior-attempts `
            --current-run-id $env:GITHUB_RUN_ID `
            --output artifacts/g8-h4-retained/complexity.json
          if ($LASTEXITCODE -ne 0) { throw "Failed to aggregate cumulative H4 complexity evidence." }

          if (Test-Path artifacts/g8-h4-retained/review-package/H5_REVIEW.md) {
            Add-Content artifacts/g8-h4-retained/review-package/H5_REVIEW.md @'

## Cumulative complexity authority

`../complexity.json` is cumulative across every retained G8-H4 authoring attempt through this candidate, not just this run. If this candidate is owner-accepted, G8-H5 must freeze this exact cumulative raw-usage evidence. Provider calls, input/output tokens, iterations/revisions, operation calls, pixel edits/changed pixels, repair/regeneration, profile/pose reuse, and wall time are authoritative evidence. Price conversion is derived/non-authoritative and is not used for the P10-C4 comparison.
'@
          }

      - name: Verify retained evidence and H5 gate
        id: verify
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path artifacts/g8-h4-retained/summary.json)) {
            throw "G8-H4 did not preserve summary.json."
          }
          $summary = Get-Content artifacts/g8-h4-retained/summary.json -Raw | ConvertFrom-Json
          if ($summary.owner_verdict -ne "pending") { throw "Automation must never self-approve G8-H5." }
          if ($summary.new_schema_or_contract_added) { throw "H4 must not add a new schema/contract without retained failure evidence and a separate minimal-fix decision." }
          if ($summary.new_raster_authority_added) { throw "H4 must reuse the existing raster authority." }
          if ($summary.animation_advanced) { throw "H4 must not advance G9 animation." }
          if ($summary.trace2d_integration_advanced) { throw "H4 must not advance Trace2D integration." }

          if (-not (Test-Path artifacts/g8-h4-retained/attempt-complexity.json)) {
            throw "Per-attempt H4 raw complexity evidence is missing."
          }
          if (-not (Test-Path artifacts/g8-h4-retained/complexity.json)) {
            throw "Cumulative H4 raw complexity evidence is missing."
          }
          $complexity = Get-Content artifacts/g8-h4-retained/complexity.json -Raw | ConvertFrom-Json
          if ($complexity.measurement_scope -ne "all-retained-g8-h4-attempts-through-owner-acceptable-candidate") {
            throw "H4 complexity must be cumulative through the current owner candidate."
          }
          if ($complexity.owner_acceptance_state -ne "pending") { throw "H4 must not self-freeze owner acceptance." }
          if ($complexity.authority.authoritative_evidence -ne "raw-usage-metrics") { throw "Raw usage metrics must remain authoritative." }
          if ($complexity.authority.price_fields_used_for_comparison) { throw "Price conversion must not be authoritative comparison evidence." }

          foreach ($field in @("provider_calls", "input_tokens", "output_tokens", "iterations", "revisions", "operation_calls", "pixel_edits", "changed_pixels", "repair_provider_calls", "regeneration_provider_calls", "canvas_restarts", "profile_research_provider_calls", "wall_time_ns")) {
            if (-not $complexity.usage_completeness.$field) {
              throw "Cumulative raw metric '$field' is incomplete; H5 cannot treat this candidate as fully evidenced."
            }
          }

          if ($summary.status -ne "succeeded") {
            if (Test-Path artifacts/g8-h4-retained/failure.json) {
              Get-Content artifacts/g8-h4-retained/failure.json -Raw | Write-Host
            }
            throw "G8-H4 retained authoring did not succeed; retained failure evidence must be reviewed before any contract change."
          }

          if ($complexity.provider_calls -lt 1) { throw "Cumulative G8-H4 must retain at least one real provider call." }
          if ($null -eq $complexity.input_tokens -or $null -eq $complexity.output_tokens) { throw "Exact cumulative provider token totals are required." }
          if ($complexity.repair_vs_regeneration.regeneration_provider_calls -ne 0) { throw "H4 must repair the same canvas, not regenerate it." }
          if (-not $complexity.cache_or_profile_reuse.humanoid_profile_reused_for_all_provider_attempts) { throw "Every provider attempt must reuse the bound humanoid profile." }
          if (-not $complexity.cache_or_profile_reuse.pose_profile_reused_for_all_provider_attempts) { throw "Every provider attempt must reuse the bound pose." }
          if ($complexity.cache_or_profile_reuse.profile_research_provider_calls -ne 0) { throw "H4 may not re-spend provider calls on retained profile research." }

          $comparison = $complexity.p10_c4_comparison.metrics
          foreach ($field in @("provider_calls", "input_tokens", "output_tokens", "iterations", "revisions", "operation_calls", "pixel_edits", "changed_pixels", "wall_time_ns")) {
            if ($null -eq $comparison.$field.percent_change) {
              throw "P10-C4 percent change is required for non-zero baseline metric '$field'."
            }
          }

          if (-not (Test-Path artifacts/g8-h4-retained/final.png)) { throw "Retained native PNG is missing." }
          if (-not (Test-Path artifacts/g8-h4-retained/preview-8x.png)) { throw "Retained 8x preview PNG is missing." }
          if (-not (Test-Path artifacts/g8-h4-retained/stage-index.json)) { throw "QA snapshot stage index is missing." }
          if (-not (Test-Path artifacts/g8-h4-retained/review-package/index.html)) { throw "English H5 review page is missing." }
          if (-not (Test-Path artifacts/g8-h4-retained/review-package/index.ko.html)) { throw "Korean H5 review page is missing." }
          if (-not (Test-Path artifacts/g8-h4-retained/review-package/H5_REVIEW.md)) { throw "H5 perceptual review guide is missing." }

      - name: Upload retained static humanoid review artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-h4-retained-authoring-${{ github.run_id }}
          path: artifacts/g8-h4-retained
          if-no-files-found: error
          retention-days: 30

      - name: Report H4 owner run directly to issue 119
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          JOB_STATUS: ${{ job.status }}
          AUTHORING_OUTCOME: ${{ steps.authoring.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          $ErrorActionPreference = "Continue"
          $summaryStatus = "unavailable"
          $failureLine = "none retained"
          $providerCalls = "unknown"
          $inputTokens = "unknown"
          $outputTokens = "unknown"

          if (Test-Path artifacts/g8-h4-retained/summary.json) {
            try {
              $summary = Get-Content artifacts/g8-h4-retained/summary.json -Raw | ConvertFrom-Json
              $summaryStatus = [string]$summary.status
            } catch {}
          }
          if (Test-Path artifacts/g8-h4-retained/failure.json) {
            try {
              $failure = Get-Content artifacts/g8-h4-retained/failure.json -Raw | ConvertFrom-Json
              $failureLine = "${($failure.failure_type)} — ${($failure.message)}"
            } catch {
              $failureLine = "failure.json exists but could not be parsed"
            }
          }
          if (Test-Path artifacts/g8-h4-retained/complexity.json) {
            try {
              $complexity = Get-Content artifacts/g8-h4-retained/complexity.json -Raw | ConvertFrom-Json
              $providerCalls = [string]$complexity.provider_calls
              $inputTokens = [string]$complexity.input_tokens
              $outputTokens = [string]$complexity.output_tokens
            } catch {}
          }

          $body = @"
### G8-H4 direct owner-run report

Run `$env:RUN_ID` attempt `$env:RUN_ATTEMPT` finished with job status **$env:JOB_STATUS**.

- run: https://github.com/$env:REPOSITORY/actions/runs/$env:RUN_ID
- authoring step: `$env:AUTHORING_OUTCOME`
- retained summary status: `$summaryStatus`
- verify step: `$env:VERIFY_OUTCOME`
- artifact upload step: `$env:UPLOAD_OUTCOME`
- retained failure: `$failureLine`
- cumulative provider calls / input tokens / output tokens: `$providerCalls` / `$inputTokens` / `$outputTokens`
- expected artifact: `g8-h4-retained-authoring-$env:RUN_ID`

This direct report is emitted by the trusted self-hosted H4 job itself so diagnosis does not depend on the separate GitHub-hosted callback workflow. H5 remains the human perceptual gate; this report does not self-approve the image or advance G9/Trace2D.
"@

          $payload = @{ body = $body } | ConvertTo-Json -Depth 4
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-RestMethod -Method Post `
            -Uri "https://api.github.com/repos/$env:REPOSITORY/issues/119/comments" `
            -Headers $headers `
            -ContentType "application/json" `
            -Body $payload | Out-Null
