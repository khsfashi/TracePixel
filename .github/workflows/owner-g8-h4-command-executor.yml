name: Owner G8-H4 command executor

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  retained-authoring:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25

    steps:
      - name: Gate exact owner H4 command inside the job
        id: gate
        shell: pwsh
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          $shouldRun = (
            $env:ISSUE_NUMBER -eq "119" -and
            $env:COMMENT_AUTHOR -eq $env:REPOSITORY_OWNER -and
            $env:COMMENT_BODY -eq "/tracepixel g8-h4-author"
          )
          if ($shouldRun) {
            "should_run=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Accepted trusted G8-H4 owner command."
          } else {
            "should_run=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "Ignoring unrelated issue comment."
          }

      - name: Report accepted H4 run immediately
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $body = @"
### G8-H4 command executor started

Run `$env:GITHUB_RUN_ID` accepted the exact owner command on main SHA `$env:GITHUB_SHA` and has started on the trusted self-hosted Windows runner.

Run: https://github.com/$env:REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
"@
          $payload = @{ body = $body } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:REPOSITORY/issues/119/comments" -Headers $headers -ContentType "application/json" -Body $payload | Out-Null

      - name: Prepare exact dispatched checkout
        id: checkout
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force
          git -C $env:GITHUB_WORKSPACE init
          git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/${{ github.repository }}.git"
          git -C $env:GITHUB_WORKSPACE fetch --depth=1 origin $env:GITHUB_SHA
          git -C $env:GITHUB_WORKSPACE checkout --detach FETCH_HEAD
          $actual = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout drift: expected $env:GITHUB_SHA, got $actual" }

      - name: Resolve local Python 3.12 and install TracePixel
        id: python
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedExe = $null
          $selectedPrefix = ""
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -3.12 -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
            if ($LASTEXITCODE -eq 0) { $selectedExe = $py.Source; $selectedPrefix = "-3.12" }
          }
          if (-not $selectedExe) {
            $python = Get-Command python -ErrorAction SilentlyContinue
            if ($python) {
              & $python.Source -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) { $selectedExe = $python.Source }
            }
          }
          if (-not $selectedExe -and $env:RUNNER_TOOL_CACHE) {
            $cached = Get-ChildItem -LiteralPath $env:RUNNER_TOOL_CACHE -Filter python.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Python[\\/]3\.12\.' }
            foreach ($candidate in $cached) {
              & $candidate.FullName -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) { $selectedExe = $candidate.FullName; break }
            }
          }
          if (-not $selectedExe) { throw "Python 3.12 is required on the trusted owner runner." }
          "TRACEPIXEL_PYTHON=$selectedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACEPIXEL_PYTHON_PREFIX=$selectedPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $prefix = @()
          if ($selectedPrefix) { $prefix += $selectedPrefix }
          & $selectedExe @prefix -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "TracePixel editable install failed." }

      - name: Verify trusted Codex CLI boundary
        id: codex
        if: steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          codex --version
          $status = codex login status 2>&1 | Out-String
          $status
          if ($status -notmatch "Logged in using ChatGPT") { throw "Codex CLI must be authenticated through the existing ChatGPT plan boundary." }
          if ($status -match "Logged in using an API key") { throw "API-key billed Codex execution is not authorized for H4." }

      - name: Run retained static humanoid authoring
        id: authoring
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @prefix -m evidence.g8_h4.retained_authoring --output artifacts/g8-h4-retained --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "G8-H4 retained authoring failed after preserving available evidence." }

      - name: Preserve current attempt complexity
        id: preserve
        if: always() && steps.gate.outputs.should_run == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts/g8-h4-retained | Out-Null
          $attempt = "artifacts/g8-h4-retained/attempt-complexity.json"
          $legacy = "artifacts/g8-h4-retained/complexity.json"
          if ((Test-Path $legacy) -and -not (Test-Path $attempt)) { Copy-Item $legacy $attempt }
          if (-not (Test-Path $attempt)) {
            $unknown = @{
              measurement_scope = "single-retained-authoring-attempt"
              raw_usage_authoritative = $true
              price_conversion_authoritative = $false
              provider_calls = $null
              input_tokens = $null
              output_tokens = $null
              iterations = $null
              revisions = $null
              operation_calls = $null
              pixel_edits = $null
              changed_pixels = $null
              repair_vs_regeneration = @{ repair_provider_calls = $null; regeneration_provider_calls = $null; canvas_restarts = $null }
              wall_time_ns = $null
              cache_or_profile_reuse = @{ humanoid_profile_reused = $null; pose_profile_reused = $null; profile_research_provider_calls = $null }
              evidence_completeness = "incomplete-failure-before-exact-attempt-complexity"
            }
            $unknown | ConvertTo-Json -Depth 8 | Set-Content $attempt -Encoding utf8
          }

      - name: Collect prior retained H4 attempts
        id: prior
        if: always() && steps.gate.outputs.should_run == 'true' && steps.python.outcome == 'success'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          $script = @'
          import io, json, os, urllib.request, zipfile
          from pathlib import Path
          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          current = int(os.environ["GITHUB_RUN_ID"])
          root = Path("artifacts/g8-h4-prior-attempts")
          root.mkdir(parents=True, exist_ok=True)
          headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "User-Agent": "TracePixel-G8-H4-command-executor"}
          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r)
          workflows = (
              "owner-g8-h4-retained-authoring.yml",
              "owner-g8-h4-push-executor.yml",
              "owner-g8-h4-command-executor.yml",
          )
          seen = set()
          for workflow in workflows:
              try:
                  runs = get_json(f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?branch=main&status=completed&per_page=100").get("workflow_runs", [])
              except Exception:
                  continue
              for run in runs:
                  run_id = int(run.get("id", 0))
                  if run_id <= 0 or run_id >= current or run_id in seen:
                      continue
                  seen.add(run_id)
                  artifacts = get_json(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts", [])
                  retained = next((a for a in artifacts if not a.get("expired", False) and a.get("name", "").startswith("g8-h4-retained-authoring-")), None)
                  if retained is None:
                      continue
                  req = urllib.request.Request(retained["archive_download_url"], headers=headers)
                  with urllib.request.urlopen(req, timeout=60) as r:
                      blob = r.read()
                  target = root / str(run_id)
                  target.mkdir(parents=True, exist_ok=True)
                  with zipfile.ZipFile(io.BytesIO(blob)) as z:
                      names = set(z.namelist())
                      for name in ("attempt-complexity.json", "complexity.json", "summary.json", "failure.json"):
                          if name in names:
                              (target / name).write_bytes(z.read(name))
          '@
          & $env:TRACEPIXEL_PYTHON @prefix -c $script
          if ($LASTEXITCODE -ne 0) { throw "Failed to collect prior retained H4 attempt evidence." }

      - name: Aggregate cumulative raw complexity
        id: aggregate
        if: always() && steps.gate.outputs.should_run == 'true' && steps.python.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          New-Item -ItemType Directory -Force artifacts/g8-h4-prior-attempts | Out-Null
          & $env:TRACEPIXEL_PYTHON @prefix -m evidence.g8_h4.cumulative_complexity `
            --current artifacts/g8-h4-retained `
            --prior-root artifacts/g8-h4-prior-attempts `
            --current-run-id $env:GITHUB_RUN_ID `
            --output artifacts/g8-h4-retained/complexity.json
          if ($LASTEXITCODE -ne 0) { throw "Failed to aggregate cumulative H4 complexity evidence." }

      - name: Verify H4 candidate and cumulative evidence
        id: verify
        if: always() && steps.gate.outputs.should_run == 'true' && steps.python.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path artifacts/g8-h4-retained/summary.json)) { throw "summary.json missing" }
          if (-not (Test-Path artifacts/g8-h4-retained/complexity.json)) { throw "complexity.json missing" }
          $summary = Get-Content artifacts/g8-h4-retained/summary.json -Raw | ConvertFrom-Json
          $complexity = Get-Content artifacts/g8-h4-retained/complexity.json -Raw | ConvertFrom-Json
          if ($summary.owner_verdict -ne "pending") { throw "H4 may not self-approve H5" }
          if ($summary.status -ne "succeeded") { throw "Retained authoring did not succeed" }
          if ($complexity.measurement_scope -ne "all-retained-g8-h4-attempts-through-owner-acceptable-candidate") { throw "Wrong cumulative measurement scope" }
          if ($complexity.authority.authoritative_evidence -ne "raw-usage-metrics") { throw "Raw usage must remain authoritative" }
          foreach ($field in @("provider_calls", "input_tokens", "output_tokens", "iterations", "revisions", "operation_calls", "pixel_edits", "changed_pixels", "repair_provider_calls", "regeneration_provider_calls", "canvas_restarts", "profile_research_provider_calls", "wall_time_ns")) {
            if (-not $complexity.usage_completeness.$field) { throw "Incomplete cumulative metric: $field" }
          }
          if ($complexity.provider_calls -lt 1) { throw "No real provider call retained" }
          if ($complexity.repair_vs_regeneration.regeneration_provider_calls -ne 0) { throw "Regeneration is forbidden in H4" }
          if (-not $complexity.cache_or_profile_reuse.humanoid_profile_reused_for_all_provider_attempts) { throw "Humanoid profile reuse drift" }
          if (-not $complexity.cache_or_profile_reuse.pose_profile_reused_for_all_provider_attempts) { throw "Pose profile reuse drift" }
          if ($complexity.cache_or_profile_reuse.profile_research_provider_calls -ne 0) { throw "Unexpected profile research call" }
          foreach ($path in @(
            "artifacts/g8-h4-retained/final.png",
            "artifacts/g8-h4-retained/preview-8x.png",
            "artifacts/g8-h4-retained/stage-index.json",
            "artifacts/g8-h4-retained/review-package/index.html",
            "artifacts/g8-h4-retained/review-package/index.ko.html",
            "artifacts/g8-h4-retained/review-package/H5_REVIEW.md"
          )) { if (-not (Test-Path $path)) { throw "Required review evidence missing: $path" } }

      - name: Upload retained H4 review artifact
        id: upload
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: g8-h4-retained-authoring-${{ github.run_id }}
          path: artifacts/g8-h4-retained
          if-no-files-found: error
          retention-days: 30

      - name: Report final H4 command result
        if: always() && steps.gate.outputs.should_run == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          AUTHORING_OUTCOME: ${{ steps.authoring.outcome }}
          PRIOR_OUTCOME: ${{ steps.prior.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          $ErrorActionPreference = "Continue"
          $summaryStatus = "unavailable"
          $failureLine = "none retained"
          $providerCalls = "unknown"
          $inputTokens = "unknown"
          $outputTokens = "unknown"
          $attemptCount = "unknown"
          if (Test-Path artifacts/g8-h4-retained/summary.json) {
            try { $summaryStatus = [string]((Get-Content artifacts/g8-h4-retained/summary.json -Raw | ConvertFrom-Json).status) } catch {}
          }
          if (Test-Path artifacts/g8-h4-retained/failure.json) {
            try {
              $failure = Get-Content artifacts/g8-h4-retained/failure.json -Raw | ConvertFrom-Json
              $failureLine = "$($failure.failure_type) — $($failure.message)"
            } catch { $failureLine = "failure.json exists but could not be parsed" }
          }
          if (Test-Path artifacts/g8-h4-retained/complexity.json) {
            try {
              $complexity = Get-Content artifacts/g8-h4-retained/complexity.json -Raw | ConvertFrom-Json
              $providerCalls = [string]$complexity.provider_calls
              $inputTokens = [string]$complexity.input_tokens
              $outputTokens = [string]$complexity.output_tokens
              $attemptCount = [string]$complexity.attempt_count
            } catch {}
          }
          $body = @"
### G8-H4 command executor result

Run `$env:GITHUB_RUN_ID` finished processing the trusted owner command on main SHA `$env:GITHUB_SHA`.

- run: https://github.com/$env:REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
- checkout / python / Codex: `$env:CHECKOUT_OUTCOME` / `$env:PYTHON_OUTCOME` / `$env:CODEX_OUTCOME`
- authoring / prior collection / aggregate: `$env:AUTHORING_OUTCOME` / `$env:PRIOR_OUTCOME` / `$env:AGGREGATE_OUTCOME`
- verify / upload: `$env:VERIFY_OUTCOME` / `$env:UPLOAD_OUTCOME`
- retained summary status: `$summaryStatus`
- retained failure: `$failureLine`
- cumulative attempts: `$attemptCount`
- cumulative provider calls / input tokens / output tokens: `$providerCalls` / `$inputTokens` / `$outputTokens`
- artifact: `g8-h4-retained-authoring-$env:GITHUB_RUN_ID`

Raw usage remains authoritative. H5 remains the human perceptual gate; G9 and Trace2D remain blocked.
"@
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $payload = @{ body = $body } | ConvertTo-Json -Depth 4
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:REPOSITORY/issues/119/comments" -Headers $headers -ContentType "application/json" -Body $payload | Out-Null
