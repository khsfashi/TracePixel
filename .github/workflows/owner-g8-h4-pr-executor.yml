name: Owner G8-H4 PR executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/g8-h4-pr-author.trigger

permissions:
  actions: read
  contents: read

concurrency:
  group: g8-h4-owner-pr-authoring
  cancel-in-progress: false

jobs:
  retained-authoring:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'agent/g8-h4-owner-run-')
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 25

    steps:
      - name: Prepare exact owner PR-head checkout
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force
          git -C $env:GITHUB_WORKSPACE init
          git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/${{ github.repository }}.git"
          git -C $env:GITHUB_WORKSPACE fetch --depth=1 origin $env:PR_HEAD_SHA
          git -C $env:GITHUB_WORKSPACE checkout --detach FETCH_HEAD
          $actual = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($actual -ne $env:PR_HEAD_SHA) {
            throw "Checkout drift: expected $env:PR_HEAD_SHA, got $actual"
          }

      - name: Resolve local Python 3.12 and install TracePixel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedExe = $null
          $selectedPrefix = ""

          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -3.12 -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
            if ($LASTEXITCODE -eq 0) {
              $selectedExe = $py.Source
              $selectedPrefix = "-3.12"
            }
          }

          if (-not $selectedExe) {
            $python = Get-Command python -ErrorAction SilentlyContinue
            if ($python) {
              & $python.Source -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) {
                $selectedExe = $python.Source
              }
            }
          }

          if (-not $selectedExe -and $env:RUNNER_TOOL_CACHE) {
            $cached = Get-ChildItem -LiteralPath $env:RUNNER_TOOL_CACHE -Filter python.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Python[\\/]3\.12\.' }
            foreach ($candidate in $cached) {
              & $candidate.FullName -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) {
                $selectedExe = $candidate.FullName
                break
              }
            }
          }

          if (-not $selectedExe) {
            throw "Python 3.12 is required on the trusted owner runner."
          }

          "TRACEPIXEL_PYTHON=$selectedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACEPIXEL_PYTHON_PREFIX=$selectedPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $prefix = @()
          if ($selectedPrefix) { $prefix += $selectedPrefix }
          & $selectedExe @prefix -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "TracePixel editable install failed." }

      - name: Verify trusted Codex CLI boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          codex --version
          $status = codex login status 2>&1 | Out-String
          $status
          if ($status -notmatch "Logged in using ChatGPT") {
            throw "G8-H4 requires Codex CLI authenticated through the existing ChatGPT plan boundary."
          }
          if ($status -match "Logged in using an API key") {
            throw "API-key billed Codex execution is not authorized for H4."
          }

      - name: Run retained static humanoid authoring
        id: authoring
        continue-on-error: true
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @prefix -m evidence.g8_h4.retained_authoring --output artifacts/g8-h4-retained --source-sha $env:PR_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw "G8-H4 retained authoring failed after preserving evidence." }

      - name: Finalize cumulative raw usage evidence
        id: finalize
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TRACEPIXEL_PYTHON) { throw "Python setup did not complete." }
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @prefix -m evidence.g8_h4.owner_evidence finalize --current artifacts/g8-h4-retained --prior-root artifacts/g8-h4-prior-attempts --repository $env:REPOSITORY --owner $env:OWNER --token $env:GH_TOKEN --current-run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw "Failed to finalize cumulative G8-H4 evidence." }

      - name: Upload retained H4 review artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-h4-retained-authoring-${{ github.run_id }}
          path: artifacts/g8-h4-retained
          if-no-files-found: error
          retention-days: 30

      - name: Verify retained candidate after artifact preservation
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TRACEPIXEL_PYTHON) { throw "Python setup did not complete." }
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @prefix -m evidence.g8_h4.owner_evidence verify --current artifacts/g8-h4-retained
          if ($LASTEXITCODE -ne 0) { throw "G8-H4 retained candidate verification failed." }
