name: Owner G8-H4 PR executor

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/g8-h4-pr-author.trigger

permissions:
  contents: read

jobs:
  retained-authoring:
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 5
    steps:
      - name: Confirm trusted self-hosted H4 runner
        shell: pwsh
        run: |
          Write-Host "G8-H4 self-hosted PR executor reached runner."
          Write-Host "run=$env:GITHUB_RUN_ID sha=$env:GITHUB_SHA"
