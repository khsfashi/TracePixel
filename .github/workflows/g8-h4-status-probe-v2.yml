name: G8-H4 status probe v2

on:
  push:
    branches:
      - main
    paths:
      - .github/g8-h4-status-probe-v2.trigger

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report all H4 executor registrations and runs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "TracePixel-G8-H4-status-probe-v2",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          targets = [
              "owner-g8-h4-retained-authoring.yml",
              "owner-g8-h4-push-executor.yml",
              "owner-g8-h4-command-executor.yml",
              "owner-g8-h4-pr-executor.yml",
              "owner-g8-h4-final-executor.yml",
          ]
          lines = ["### G8-H4 executor status probe v2", ""]

          try:
              workflow_payload = get_json(f"https://api.github.com/repos/{repo}/actions/workflows?per_page=100")
              registered = {
                  str(item.get("path", "")).split("/")[-1]: item
                  for item in workflow_payload.get("workflows", [])
              }
          except Exception as exc:
              registered = {}
              lines.append(f"Workflow-list probe failed: `{type(exc).__name__}: {exc}`")
              lines.append("")

          for filename in targets:
              info = registered.get(filename)
              if info is None:
                  lines.append(f"**{filename}** — not returned by Actions workflow registry")
              else:
                  lines.append(
                      f"**{filename}** — registry id `{info.get('id')}`, name `{info.get('name')}`, state `{info.get('state')}`"
                  )
              try:
                  payload = get_json(f"https://api.github.com/repos/{repo}/actions/workflows/{filename}/runs?per_page=6")
                  runs = payload.get("workflow_runs", [])
                  if not runs:
                      lines.append("- no runs returned")
                  for run in runs:
                      lines.append(
                          f"- `{run.get('id')}` event `{run.get('event')}` status `{run.get('status')}` conclusion `{run.get('conclusion')}` sha `{str(run.get('head_sha') or '')[:12]}`"
                      )
              except urllib.error.HTTPError as exc:
                  lines.append(f"- runs endpoint HTTP `{exc.code}`")
              except Exception as exc:
                  lines.append(f"- runs probe error `{type(exc).__name__}: {exc}`")
              lines.append("")

          body = "\n".join(lines)
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/119/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30):
              pass
