name: G8-H4 PR event probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/g8-h4-pr-author.trigger

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm trigger event
        run: echo "G8-H4 PR trigger event reached workflow registration."
