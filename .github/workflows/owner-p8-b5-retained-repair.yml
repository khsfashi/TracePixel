name: Owner P8-B5 localized retained repair

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: p8-b5-owner-retained-repair
  cancel-in-progress: false

jobs:
  localized-repair:
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    steps:
      - name: Prepare exact dispatched checkout without marketplace action
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force
          git -C $env:GITHUB_WORKSPACE init
          git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/${{ github.repository }}.git"
          git -C $env:GITHUB_WORKSPACE fetch --depth=1 origin $env:GITHUB_SHA
          git -C $env:GITHUB_WORKSPACE checkout --detach FETCH_HEAD
          $actual = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Manual checkout drifted from dispatched SHA: expected $env:GITHUB_SHA, got $actual"
          }

      - name: Resolve local Python 3.12 and install TracePixel
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $selectedExe = $null
          $selectedPrefix = ""

          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -3.12 -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
            if ($LASTEXITCODE -eq 0) {
              $selectedExe = $py.Source
              $selectedPrefix = "-3.12"
            }
          }

          if (-not $selectedExe) {
            $python = Get-Command python -ErrorAction SilentlyContinue
            if ($python) {
              & $python.Source -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) {
                $selectedExe = $python.Source
              }
            }
          }

          if (-not $selectedExe -and $env:RUNNER_TOOL_CACHE) {
            $cached = Get-ChildItem -LiteralPath $env:RUNNER_TOOL_CACHE -Filter python.exe -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '[\\/]Python[\\/]3\.12\.' }
            foreach ($candidate in $cached) {
              & $candidate.FullName -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) {
                $selectedExe = $candidate.FullName
                break
              }
            }
          }

          if (-not $selectedExe) {
            throw "Python 3.12 is required on the trusted owner runner; actions/setup-python is intentionally avoided to reduce codeload.github.com rate-limit exposure."
          }

          "TRACEPIXEL_PYTHON=$selectedExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACEPIXEL_PYTHON_PREFIX=$selectedPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $prefix = @()
          if ($selectedPrefix) { $prefix += $selectedPrefix }
          & $selectedExe @prefix -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "TracePixel editable install failed." }

      - name: Verify trusted Codex CLI boundary
        shell: pwsh
        run: |
          codex --version
          $status = codex login status 2>&1 | Out-String
          $status
          if ($status -notmatch "Logged in using ChatGPT") {
            throw "P8-B5 repair requires Codex CLI authenticated through the existing ChatGPT plan boundary."
          }
          if ($status -match "Logged in using an API key") {
            throw "API-key billed Codex execution is not authorized for this owner gate."
          }

      - name: Download reviewed retained-authoring source through GitHub REST
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $sourceArtifactId = 9286172654
          $sourceArtifactName = "p8-b5-retained-authoring-32022902199"
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $base = "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$sourceArtifactId"
          $metadata = Invoke-RestMethod -Uri $base -Headers $headers -Method Get
          if ([int64]$metadata.id -ne $sourceArtifactId) {
            throw "Reviewed source artifact id drifted."
          }
          if ($metadata.name -ne $sourceArtifactName) {
            throw "Reviewed source artifact name drifted: $($metadata.name)"
          }
          if ($metadata.expired) {
            throw "Reviewed source artifact has expired."
          }

          New-Item -ItemType Directory -Force artifacts | Out-Null
          $zip = Join-Path $env:GITHUB_WORKSPACE "artifacts/p8-b5-reviewed-source.zip"
          Invoke-WebRequest -Uri "$base/zip" -Headers $headers -OutFile $zip -MaximumRedirection 10
          if ($metadata.digest) {
            $downloadedDigest = "sha256:" + (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($downloadedDigest -ne $metadata.digest.ToLowerInvariant()) {
              throw "Reviewed source artifact archive digest mismatch."
            }
          }
          $destination = Join-Path $env:GITHUB_WORKSPACE "artifacts/p8-b5-reviewed-source"
          New-Item -ItemType Directory -Force $destination | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $destination -Force

      - name: Re-author only owner-rejected grass-center-b
        shell: pwsh
        run: |
          $prefix = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $prefix += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @prefix -m evidence.p8_b5.retained_repair --source artifacts/p8-b5-reviewed-source --output artifacts/p8-b5-repair
          if ($LASTEXITCODE -ne 0) { throw "Localized retained repair failed." }

      - name: Verify localized repair remains an owner gate
        shell: pwsh
        run: |
          $summary = Get-Content artifacts/p8-b5-repair/summary.json -Raw | ConvertFrom-Json
          if ($summary.review_scope -ne "retained-output") {
            throw "Expected retained-output review scope."
          }
          if ($summary.source_run_id -ne 32022902199) {
            throw "Repair source run drifted from the owner-reviewed artifact."
          }
          if ($summary.member_count -ne 8) {
            throw "Expected the full eight-member review package after localized repair."
          }
          if ($summary.preserved_member_count -ne 7) {
            throw "Exactly seven owner-accepted siblings must remain preserved."
          }
          if ($summary.repair_member_id -ne "grass-center-b") {
            throw "Only grass-center-b is authorized for repair."
          }
          if ($summary.repair_declared_max_concurrency -ne 1) {
            throw "Localized repair must run with max_concurrency=1."
          }
          if (-not $summary.replacement_changed) {
            throw "Owner-rejected PNG was not replaced."
          }
          if (-not $summary.repair_constraint_satisfied) {
            throw "Owner-repair full-coverage constraint did not pass."
          }
          if ($summary.owner_verdict -ne "pending") {
            throw "Automation must never self-approve the repaired P8-B5 owner verdict."
          }
          if (-not (Test-Path artifacts/p8-b5-repair/review-package/index.html)) {
            throw "English repair review page is missing."
          }
          if (-not (Test-Path artifacts/p8-b5-repair/review-package/index.ko.html)) {
            throw "Korean repair review page is missing."
          }

      - name: Upload localized repair review artifact
        uses: actions/upload-artifact@v4
        with:
          name: p8-b5-retained-repair-${{ github.run_id }}
          path: artifacts/p8-b5-repair
          if-no-files-found: error
          retention-days: 7
