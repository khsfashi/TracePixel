name: Owner G8-H4 final executor

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Validate exact owner H4 command
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          should_run=false
          if [[ "$EVENT_NAME" == "issue_comment" && "$ISSUE_NUMBER" == "119" && "$COMMENT_AUTHOR" == "$REPOSITORY_OWNER" && "$COMMENT_BODY" == "/tracepixel g8-h4-author" ]]; then
            should_run=true
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$ACTOR" == "$REPOSITORY_OWNER" && "$REF_NAME" == "main" ]]; then
            should_run=true
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Report accepted run before self-hosted scheduling
        if: steps.check.outputs.should_run == 'true'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          token = os.environ["GH_TOKEN"]
          body = (
              "### G8-H4 final executor accepted\n\n"
              f"Run `{run_id}` passed the GitHub-hosted owner gate and is now waiting for or running on the trusted self-hosted Windows runner.\n\n"
              f"Run: https://github.com/{repo}/actions/runs/{run_id}\n\n"
              f"Source SHA: `{os.environ['HEAD_SHA']}`"
          )
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
              "User-Agent": "TracePixel-G8-H4-final-executor",
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/119/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers=headers,
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30):
              pass

  retained-authoring:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on:
      - self-hosted
      - Windows
      - X64
    timeout-minutes: 25

    steps:
      - name: Prepare exact default-branch checkout
        id: checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force
          git -C $env:GITHUB_WORKSPACE init
          git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/${{ github.repository }}.git"
          git -C $env:GITHUB_WORKSPACE fetch --depth=1 origin $env:GITHUB_SHA
          git -C $env:GITHUB_WORKSPACE checkout --detach FETCH_HEAD
          $actual = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) {
            throw "Checkout drift: expected $env:GITHUB_SHA, got $actual"
          }

      - name: Resolve Python 3.12 and install TracePixel
        id: python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = $null
          $prefix = ""
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -3.12 -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
            if ($LASTEXITCODE -eq 0) {
              $exe = $py.Source
              $prefix = "-3.12"
            }
          }
          if (-not $exe) {
            $python = Get-Command python -ErrorAction SilentlyContinue
            if ($python) {
              & $python.Source -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) {
                $exe = $python.Source
              }
            }
          }
          if (-not $exe) {
            throw "Python 3.12 is required on the trusted owner runner."
          }
          "TRACEPIXEL_PYTHON=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACEPIXEL_PYTHON_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $args = @()
          if ($prefix) { $args += $prefix }
          & $exe @args -m pip install -e .
          if ($LASTEXITCODE -ne 0) {
            throw "TracePixel editable install failed."
          }

      - name: Verify trusted Codex CLI boundary
        id: codex
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          codex --version
          $status = codex login status 2>&1 | Out-String
          $status
          if ($status -notmatch "Logged in using ChatGPT") {
            throw "G8-H4 requires Codex CLI authenticated through the existing ChatGPT plan boundary."
          }
          if ($status -match "Logged in using an API key") {
            throw "API-key billed Codex execution is not authorized for this owner gate."
          }

      - name: Run retained static humanoid authoring
        id: authoring
        continue-on-error: true
        shell: pwsh
        run: |
          $args = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $args += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @args -m evidence.g8_h4.retained_authoring --output artifacts/g8-h4-retained --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) {
            throw "G8-H4 retained authoring failed after preserving available evidence."
          }

      - name: Preserve attempt complexity
        id: preserve
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts/g8-h4-retained | Out-Null
          $legacy = "artifacts/g8-h4-retained/complexity.json"
          $attempt = "artifacts/g8-h4-retained/attempt-complexity.json"
          if ((Test-Path $legacy) -and -not (Test-Path $attempt)) {
            Copy-Item $legacy $attempt
          }
          if (-not (Test-Path $attempt)) {
            $unknown = @{
              measurement_scope = "single-retained-authoring-attempt"
              raw_usage_authoritative = $true
              price_conversion_authoritative = $false
              evidence_completeness = "incomplete-failure-before-exact-attempt-complexity"
            }
            $unknown | ConvertTo-Json -Depth 4 | Set-Content $attempt -Encoding utf8
          }

      - name: Aggregate cumulative raw complexity
        id: aggregate
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TRACEPIXEL_PYTHON) {
            throw "Python setup did not complete; cumulative complexity cannot be computed."
          }
          New-Item -ItemType Directory -Force artifacts/g8-h4-prior-attempts | Out-Null
          $args = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $args += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @args -m evidence.g8_h4.cumulative_complexity `
            --current artifacts/g8-h4-retained `
            --prior-root artifacts/g8-h4-prior-attempts `
            --current-run-id $env:GITHUB_RUN_ID `
            --output artifacts/g8-h4-retained/complexity.json
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to aggregate cumulative H4 complexity evidence."
          }

      - name: Verify retained candidate and evidence
        id: verify
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path artifacts/g8-h4-retained/summary.json)) { throw "summary.json missing" }
          if (-not (Test-Path artifacts/g8-h4-retained/complexity.json)) { throw "complexity.json missing" }
          $summary = Get-Content artifacts/g8-h4-retained/summary.json -Raw | ConvertFrom-Json
          $complexity = Get-Content artifacts/g8-h4-retained/complexity.json -Raw | ConvertFrom-Json
          if ($summary.status -ne "succeeded") { throw "Retained authoring did not succeed" }
          if ($summary.owner_verdict -ne "pending") { throw "H4 may not self-approve H5" }
          if ($complexity.measurement_scope -ne "all-retained-g8-h4-attempts-through-owner-acceptable-candidate") { throw "Wrong cumulative measurement scope" }
          if ($complexity.authority.authoritative_evidence -ne "raw-usage-metrics") { throw "Raw usage must remain authoritative" }
          if ($complexity.provider_calls -lt 1) { throw "No real provider call retained" }
          if ($complexity.repair_vs_regeneration.regeneration_provider_calls -ne 0) { throw "Regeneration is forbidden in H4" }
          foreach ($path in @(
            "artifacts/g8-h4-retained/final.png",
            "artifacts/g8-h4-retained/preview-8x.png",
            "artifacts/g8-h4-retained/review-package/index.html",
            "artifacts/g8-h4-retained/review-package/index.ko.html",
            "artifacts/g8-h4-retained/review-package/H5_REVIEW.md"
          )) {
            if (-not (Test-Path $path)) { throw "Required review evidence missing: $path" }
          }

      - name: Upload retained H4 review artifact
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-h4-retained-authoring-${{ github.run_id }}
          path: artifacts/g8-h4-retained
          if-no-files-found: error
          retention-days: 30

      - name: Report final H4 executor result
        id: report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUTHORING_OUTCOME: ${{ steps.authoring.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          $ErrorActionPreference = "Continue"
          $summaryStatus = "unavailable"
          $failureLine = "none retained"
          $providerCalls = "unknown"
          $inputTokens = "unknown"
          $outputTokens = "unknown"
          $attemptCount = "unknown"
          if (Test-Path artifacts/g8-h4-retained/summary.json) {
            try {
              $summary = Get-Content artifacts/g8-h4-retained/summary.json -Raw | ConvertFrom-Json
              $summaryStatus = [string]$summary.status
            } catch {}
          }
          if (Test-Path artifacts/g8-h4-retained/failure.json) {
            try {
              $failure = Get-Content artifacts/g8-h4-retained/failure.json -Raw | ConvertFrom-Json
              $failureLine = "$($failure.failure_type) — $($failure.message)"
            } catch {}
          }
          if (Test-Path artifacts/g8-h4-retained/complexity.json) {
            try {
              $complexity = Get-Content artifacts/g8-h4-retained/complexity.json -Raw | ConvertFrom-Json
              $providerCalls = [string]$complexity.provider_calls
              $inputTokens = [string]$complexity.input_tokens
              $outputTokens = [string]$complexity.output_tokens
              $attemptCount = [string]$complexity.attempt_count
            } catch {}
          }
          $body = @"
### G8-H4 final executor result

Run `$env:GITHUB_RUN_ID` completed the retained-authoring path.

- run: https://github.com/$env:REPOSITORY/actions/runs/$env:GITHUB_RUN_ID
- authoring step: `$env:AUTHORING_OUTCOME`
- cumulative aggregation: `$env:AGGREGATE_OUTCOME`
- verification: `$env:VERIFY_OUTCOME`
- artifact upload: `$env:UPLOAD_OUTCOME`
- retained summary status: `$summaryStatus`
- retained failure: `$failureLine`
- cumulative attempts: `$attemptCount`
- provider calls / input tokens / output tokens: `$providerCalls` / `$inputTokens` / `$outputTokens`
- artifact: `g8-h4-retained-authoring-$env:GITHUB_RUN_ID`

H5 remains the human perceptual gate. This run does not self-approve visual quality or advance G9/Trace2D.
"@
          $payload = @{ body = $body } | ConvertTo-Json -Depth 4
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:REPOSITORY/issues/119/comments" -Headers $headers -ContentType "application/json" -Body $payload | Out-Null
