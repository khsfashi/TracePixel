name: G8-H4 status probe

on:
  push:
    branches: [main]
    paths:
      - .github/g8-h4-status-probe.trigger

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report latest H4 workflow runs
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          import urllib.request
          import urllib.error

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "TracePixel-G8-H4-status-probe",
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          workflows = [
              "owner-g8-h4-retained-authoring.yml",
              "owner-g8-h4-push-executor.yml",
          ]
          lines = ["### G8-H4 live Actions status probe", ""]
          for workflow in workflows:
              lines.append(f"**{workflow}**")
              try:
                  payload = get_json(
                      f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs?per_page=8"
                  )
                  runs = payload.get("workflow_runs", [])
                  if not runs:
                      lines.append("- no workflow runs returned")
                  for run in runs:
                      lines.append(
                          "- run `{id}` | event `{event}` | status `{status}` | conclusion `{conclusion}` | "
                          "sha `{sha}` | created `{created}` | updated `{updated}`".format(
                              id=run.get("id"),
                              event=run.get("event"),
                              status=run.get("status"),
                              conclusion=run.get("conclusion"),
                              sha=(run.get("head_sha") or "")[:12],
                              created=run.get("created_at"),
                              updated=run.get("updated_at"),
                          )
                      )
              except Exception as exc:
                  lines.append(f"- probe error: `{type(exc).__name__}: {exc}`")
              lines.append("")

          try:
              runner_payload = get_json(f"https://api.github.com/repos/{repo}/actions/runners?per_page=100")
              runners = runner_payload.get("runners", [])
              lines.append("**Repository self-hosted runners visible to GITHUB_TOKEN**")
              if not runners:
                  lines.append("- none returned")
              for runner in runners:
                  labels = ", ".join(label.get("name", "") for label in runner.get("labels", []))
                  lines.append(
                      f"- `{runner.get('name')}` status `{runner.get('status')}` busy `{runner.get('busy')}` labels `{labels}`"
                  )
          except Exception as exc:
              lines.append("**Repository self-hosted runners**")
              lines.append(f"- endpoint unavailable to workflow token: `{type(exc).__name__}: {exc}`")

          lines.extend([
              "",
              "This probe is read-only. It does not launch another authoring attempt or change H5/G9/Trace2D state.",
          ])
          body = "\n".join(lines)
          data = json.dumps({"body": body}).encode("utf-8")
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/119/comments",
              data=data,
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=30):
              pass
