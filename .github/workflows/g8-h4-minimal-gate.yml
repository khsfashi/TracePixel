name: G8-H4 retained authoring

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  gate:
    if: github.event.issue.number == 119 && github.event.comment.user.login == 'khsfashi' && github.event.comment.body == '/tracepixel g8-h4-author'
    runs-on: ubuntu-latest
    steps:
      - name: Report accepted run
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json, os, urllib.request
          body = f"### G8-H4 retained authoring accepted\n\nRun `{os.environ['GITHUB_RUN_ID']}` passed the GitHub-hosted owner gate and is proceeding to the trusted self-hosted runner."
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/119/comments", data=json.dumps({"body": body}).encode(), headers=headers, method="POST")
          urllib.request.urlopen(req, timeout=30).read()

  author:
    needs: gate
    if: github.event.issue.number == 119 && github.event.comment.user.login == 'khsfashi' && github.event.comment.body == '/tracepixel g8-h4-author'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    steps:
      - name: Checkout exact event SHA
        id: checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Force | Remove-Item -Recurse -Force
          git -C $env:GITHUB_WORKSPACE init
          git -C $env:GITHUB_WORKSPACE remote add origin "https://github.com/${{ github.repository }}.git"
          git -C $env:GITHUB_WORKSPACE fetch --depth=1 origin $env:GITHUB_SHA
          git -C $env:GITHUB_WORKSPACE checkout --detach FETCH_HEAD
          $actual = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          if ($actual -ne $env:GITHUB_SHA) { throw "Checkout drift: expected $env:GITHUB_SHA, got $actual" }

      - name: Resolve Python 3.12 and install TracePixel
        id: python
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = $null
          $prefix = ""
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            & $py.Source -3.12 -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
            if ($LASTEXITCODE -eq 0) { $exe = $py.Source; $prefix = "-3.12" }
          }
          if (-not $exe) {
            $python = Get-Command python -ErrorAction SilentlyContinue
            if ($python) {
              & $python.Source -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 1)"
              if ($LASTEXITCODE -eq 0) { $exe = $python.Source }
            }
          }
          if (-not $exe) { throw "Python 3.12 is required on the trusted runner." }
          "TRACEPIXEL_PYTHON=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TRACEPIXEL_PYTHON_PREFIX=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $args = @()
          if ($prefix) { $args += $prefix }
          & $exe @args -m pip install -e .
          if ($LASTEXITCODE -ne 0) { throw "TracePixel editable install failed." }

      - name: Verify Codex ChatGPT authentication
        id: codex
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          codex --version
          $status = codex login status 2>&1 | Out-String
          $status
          if ($status -notmatch "Logged in using ChatGPT") { throw "Codex CLI is not authenticated through ChatGPT." }
          if ($status -match "Logged in using an API key") { throw "API-key billed Codex execution is not authorized for H4." }

      - name: Run retained static humanoid authoring
        id: authoring
        continue-on-error: true
        shell: pwsh
        run: |
          $args = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $args += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @args -m evidence.g8_h4.retained_authoring --output artifacts/g8-h4-retained --source-sha $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw "Retained H4 authoring returned nonzero after preserving available evidence." }

      - name: Preserve per-attempt raw complexity
        id: preserve
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts/g8-h4-retained | Out-Null
          $attempt = "artifacts/g8-h4-retained/attempt-complexity.json"
          $legacy = "artifacts/g8-h4-retained/complexity.json"
          if ((Test-Path $legacy) -and -not (Test-Path $attempt)) { Copy-Item $legacy $attempt }
          if (-not (Test-Path $attempt)) {
            @{ measurement_scope = "single-retained-authoring-attempt"; raw_usage_authoritative = $true; evidence_completeness = "incomplete-before-exact-usage" } | ConvertTo-Json | Set-Content $attempt -Encoding utf8
          }

      - name: Build cumulative complexity for retained attempts
        id: aggregate
        if: always() && steps.python.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force artifacts/g8-h4-prior-attempts | Out-Null
          $args = @()
          if ($env:TRACEPIXEL_PYTHON_PREFIX) { $args += $env:TRACEPIXEL_PYTHON_PREFIX }
          & $env:TRACEPIXEL_PYTHON @args -m evidence.g8_h4.cumulative_complexity --current artifacts/g8-h4-retained --prior-root artifacts/g8-h4-prior-attempts --current-run-id $env:GITHUB_RUN_ID --output artifacts/g8-h4-retained/complexity.json
          if ($LASTEXITCODE -ne 0) { throw "Cumulative complexity aggregation failed." }

      - name: Verify candidate when authoring succeeded
        id: verify
        if: steps.authoring.outcome == 'success' && steps.aggregate.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $summary = Get-Content artifacts/g8-h4-retained/summary.json -Raw | ConvertFrom-Json
          $complexity = Get-Content artifacts/g8-h4-retained/complexity.json -Raw | ConvertFrom-Json
          if ($summary.status -ne "succeeded") { throw "Retained authoring summary is not succeeded." }
          if ($summary.owner_verdict -ne "pending") { throw "H4 may not self-approve H5." }
          if ($complexity.authority.authoritative_evidence -ne "raw-usage-metrics") { throw "Raw usage is not authoritative." }
          foreach ($path in @("artifacts/g8-h4-retained/final.png", "artifacts/g8-h4-retained/preview-8x.png", "artifacts/g8-h4-retained/review-package/index.ko.html")) {
            if (-not (Test-Path $path)) { throw "Missing retained review file: $path" }
          }

      - name: Upload retained evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g8-h4-retained-authoring-${{ github.run_id }}
          path: artifacts/g8-h4-retained
          if-no-files-found: error
          retention-days: 30

      - name: Report retained authoring result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          AUTHORING_OUTCOME: ${{ steps.authoring.outcome }}
          AGGREGATE_OUTCOME: ${{ steps.aggregate.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          $ErrorActionPreference = "Continue"
          $summaryStatus = "unavailable"
          $failure = "none retained"
          $usage = "unknown"
          if (Test-Path artifacts/g8-h4-retained/summary.json) {
            try { $summaryStatus = [string](Get-Content artifacts/g8-h4-retained/summary.json -Raw | ConvertFrom-Json).status } catch {}
          }
          if (Test-Path artifacts/g8-h4-retained/failure.json) {
            try { $f = Get-Content artifacts/g8-h4-retained/failure.json -Raw | ConvertFrom-Json; $failure = "$($f.failure_type): $($f.message)" } catch {}
          }
          if (Test-Path artifacts/g8-h4-retained/complexity.json) {
            try { $c = Get-Content artifacts/g8-h4-retained/complexity.json -Raw | ConvertFrom-Json; $usage = "provider=$($c.provider_calls), input=$($c.input_tokens), output=$($c.output_tokens)" } catch {}
          }
          $body = "### G8-H4 retained authoring result`n`nRun ``$env:GITHUB_RUN_ID`` finished the trusted authoring path.`n`n- authoring: ``$env:AUTHORING_OUTCOME```n- cumulative complexity: ``$env:AGGREGATE_OUTCOME```n- verification: ``$env:VERIFY_OUTCOME```n- artifact upload: ``$env:UPLOAD_OUTCOME```n- retained summary: ``$summaryStatus```n- failure: ``$failure```n- raw usage: ``$usage```n- artifact: ``g8-h4-retained-authoring-$env:GITHUB_RUN_ID```n`nH5 remains human-only; this result does not advance G9 or Trace2D."
          $payload = @{ body = $body } | ConvertTo-Json
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:REPOSITORY/issues/119/comments" -Headers $headers -ContentType "application/json" -Body $payload | Out-Null

      - name: Fail if retained authoring was not fully verified
        if: always() && (steps.authoring.outcome != 'success' || steps.aggregate.outcome != 'success' || steps.verify.outcome != 'success' || steps.upload.outcome != 'success')
        shell: pwsh
        run: throw "G8-H4 retained authoring did not complete with fully verified evidence."
