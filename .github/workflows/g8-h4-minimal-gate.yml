name: G8-H4 minimal gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  gate:
    if: github.event.issue.number == 119 && github.event.comment.user.login == 'khsfashi' && github.event.comment.body == '/tracepixel g8-h4-author'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm workflow validity
        run: echo "G8-H4 minimal gate accepted run $GITHUB_RUN_ID"
      - name: Report run id
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json, os, urllib.request
          body = f"### G8-H4 minimal gate accepted\n\nRun `{os.environ['GITHUB_RUN_ID']}` passed the GitHub-hosted gate. The self-hosted scheduling probe is next."
          headers = {"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
          req = urllib.request.Request(f"https://api.github.com/repos/{os.environ['REPOSITORY']}/issues/119/comments", data=json.dumps({"body": body}).encode(), headers=headers, method="POST")
          urllib.request.urlopen(req, timeout=30).read()

  selfhost-probe:
    needs: gate
    if: github.event.issue.number == 119 && github.event.comment.user.login == 'khsfashi' && github.event.comment.body == '/tracepixel g8-h4-author'
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Confirm trusted runner scheduling
        run: echo "G8-H4 self-hosted scheduling probe is running"
